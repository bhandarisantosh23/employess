version: "3.9"

services:
  # =========================================================
  # Spring Boot Application
  # =========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: security-demo:latest
    container_name: security-demo-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: prod

      # Database connection (PostgreSQL below)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/securitydb
      SPRING_DATASOURCE_USERNAME: securityuser
      SPRING_DATASOURCE_PASSWORD: securitypass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect

      # JWT settings (override application.yml)
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION: 86400000

      # JVM options
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - security-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # =========================================================
  # PostgreSQL Database
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: security-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securitydb
      POSTGRES_USER: securityuser
      POSTGRES_PASSWORD: securitypass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - security-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securityuser -d securitydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================
  # pgAdmin (optional — DB UI)
  # =========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: security-demo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - security-network

# =========================================================
# Networks
# =========================================================
networks:
  security-network:
    driver: bridge

# =========================================================
# Volumes
# =========================================================
volumes:
  postgres_data:
    driver: local
    driver: local